name: Keep Supabase Project Active

on:
  schedule:
    - cron: "17 1,7,13,19 * * *" # four database requests per day, UTC
  workflow_dispatch: {}

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Query database
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ANON_KEY"
          code=$(curl --silent --show-error --retry 2 --retry-delay 5 --max-time 30 \
            --output /dev/null --write-out "%{http_code}" \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "https://omiaoaricfqqcvihsspe.supabase.co/rest/v1/animes?select=id&limit=1")
          echo "database HTTP $code"
          test "$code" = "200"
